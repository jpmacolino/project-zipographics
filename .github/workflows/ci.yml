name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    # CI never needs (or receives) CENSUS_API_KEY: default tests use mocked HTTP and synthetic data.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # ruff lint, ruff format --check, mypy, pytest + coverage (>= 90 %), file-size and secrets gates
      # the matrix already runs 3.11 and 3.12, so the local-only second pass is skipped here
      - run: uv run python scripts/check.py --skip-py311
