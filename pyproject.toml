[project]
name = "zipographics"
version = "0.1.0"
description = "Demographic profiles of a set of US ZIP codes (Census ZCTAs) from ACS data, as a local dashboard."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "FloridaMenConsulting" }]
keywords = ["zip code", "ZCTA", "census", "ACS", "demographics", "streamlit", "marketing"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "pyarrow>=15",
    "geopandas>=1.0",
    "shapely>=2.1",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "folium>=0.17",
    "streamlit-folium>=0.22",
    "matplotlib>=3.8",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.scripts]
zipographics = "zipographics.cli:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "responses>=0.25",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-requests>=2.31",
]
visual = [
    "playwright>=1.45",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zipographics"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not data and not network and not slow and not visual'"
markers = [
    "data: needs the built data artifacts in data/ (run scripts/build_data.py first)",
    "network: calls the real Census Data API (needs CENSUS_API_KEY); run manually",
    "slow: performance benchmarks",
    "visual: launches the Streamlit app and captures screenshots with Playwright",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["zipographics"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ['if __name__ == .__main__.:', "if TYPE_CHECKING:"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "PLW1514"]
# PLW1514 (unspecified-encoding) is a preview rule: opt in to it alone, not to all preview behavior.
# It only sees open() and inline Path(...) calls; scripts/check.py has an AST "encoding" gate for
# the rest (p.read_text() on a variable, subprocess text=True).
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
# The metric registry is declarative data: long help strings and variable tables read better
# unwrapped, and it uses the multiplication and summation signs in docstrings.
"src/zipographics/metrics.py" = ["E501", "RUF002"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["zipographics"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
